# Test override: generous rate limits so unrelated functional tests (which all share the same
# MockMvc "127.0.0.1" remote address, and often reuse the same Spring context/RateLimiter
# singleton across test classes) never hit a 429 by accident. Rate limiting itself is exercised
# by dedicated tests with small, explicit @TestPropertySource overrides.
rate-limit:
  login:
    per-ip:
      capacity: 100000
      refill-period: 1m
    per-account:
      capacity: 100000
      refill-period: 1m
  register:
    per-ip:
      capacity: 100000
      refill-period: 1m
  search:
    per-ip:
      capacity: 100000
      refill-period: 1m
