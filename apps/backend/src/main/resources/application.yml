server:
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: strict

spring:
  application:
    name: proust-club-back

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/proustclub}
    username: ${DB_USERNAME:proustclub}
    password: ${DB_PASSWORD:proustclub_dev}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Mailhog (dev) accepts unauthenticated, unencrypted SMTP — a real prod provider will need
    # username/password/starttls, to be set via env vars once prod deployment is configured.
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jooq:
    sql-dialect: postgres

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

app:
  # Base URL of the frontend SPA — used to build the password-reset link sent by email.
  # Points at the frontend (Vite dev server), never the backend, which has no such route.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

rate-limit:
  login:
    per-ip:
      capacity: 10
      refill-period: 1m
    per-account:
      capacity: 5
      refill-period: 5m
  register:
    per-ip:
      capacity: 5
      refill-period: 1h
  search:
    per-ip:
      capacity: 60
      refill-period: 1m
  password-reset:
    per-ip:
      capacity: 5
      refill-period: 1h
    per-account:
      capacity: 3
      refill-period: 15m
  password-change:
    per-account:
      capacity: 5
      refill-period: 15m
  email-verification-resend:
    per-account:
      capacity: 3
      refill-period: 15m

logging:
  level:
    root: INFO
    com.proustclub: INFO
    org.flywaydb: INFO
    org.jooq: WARN
