server:
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: strict

spring:
  application:
    name: proust-club-back

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/proustclub}
    username: ${DB_USERNAME:proustclub}
    password: ${DB_PASSWORD:proustclub_dev}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jooq:
    sql-dialect: postgres

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

rate-limit:
  login:
    per-ip:
      capacity: 10
      refill-period: 1m
    per-account:
      capacity: 5
      refill-period: 5m
  register:
    per-ip:
      capacity: 5
      refill-period: 1h
  search:
    per-ip:
      capacity: 60
      refill-period: 1m

logging:
  level:
    root: INFO
    com.proustclub: INFO
    org.flywaydb: INFO
    org.jooq: WARN
