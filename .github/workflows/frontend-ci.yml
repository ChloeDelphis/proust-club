name: Frontend CI

on:
  # No paths: filter here on purpose — this must always run on PRs to master
  # so it can be a required status check without ever getting stuck "pending"
  # on a PR that never touches apps/frontend/**.
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@ce3b1e5f04cd26dbb4614172464b544b5633cc92 # v2.1.0
        with:
          version: "11.19.0"
          runtime: node@24
          working-directory: apps/frontend
          require-lockfile: true
          cache: true
      - run: pnpm lint
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          # Keep in sync with vite.config.ts's test.coverage.thresholds.lines.
          THRESHOLD=85
          {
            echo "## Frontend code coverage"
            echo ""
            read -r PCT COVERED TOTAL <<< "$(node scripts/print-coverage-summary.ts 2>/dev/null)"
            if [[ "$COVERED" =~ ^[0-9]+$ && "$TOTAL" =~ ^[0-9]+$ ]] && [ "$TOTAL" -gt 0 ]; then
              STATUS="✅ Above threshold"
              # Compare the raw covered/total ratio against the threshold, not the
              # display-rounded $PCT — rounding could show "Above threshold" for a run
              # that actually failed the real vitest threshold check.
              awk "BEGIN { exit !($COVERED * 100 < $THRESHOLD * $TOTAL) }" && STATUS="❌ Below threshold"
              echo "Lines: ${PCT}% (${COVERED}/${TOTAL})"
              echo "Threshold: ${THRESHOLD}%"
              echo "$STATUS"
            else
              echo "Coverage unavailable — report missing or empty"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm build
      - run: pnpm audit:security
