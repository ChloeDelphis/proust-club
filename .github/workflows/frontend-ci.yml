name: Frontend CI

on:
  # No paths: filter here on purpose — this must always run on PRs to master
  # so it can be a required status check without ever getting stuck "pending"
  # on a PR that never touches apps/frontend/**.
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@ce3b1e5f04cd26dbb4614172464b544b5633cc92 # v2.1.0
        with:
          version: "11.19.0"
          runtime: node@24
          working-directory: apps/frontend
          require-lockfile: true
          cache: true
      - run: pnpm lint
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          REPORT=coverage/coverage-summary.json
          if [ ! -f "$REPORT" ]; then
            {
              echo "## Frontend code coverage"
              echo ""
              echo "Coverage unavailable — report not generated"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PCT=$(node -e "console.log(require('./$REPORT').total.lines.pct)")
          COVERED=$(node -e "console.log(require('./$REPORT').total.lines.covered)")
          TOTAL=$(node -e "console.log(require('./$REPORT').total.lines.total)")
          THRESHOLD=85
          STATUS="✅ Above threshold"
          awk "BEGIN { exit !($PCT < $THRESHOLD) }" && STATUS="❌ Below threshold"
          {
            echo "## Frontend code coverage"
            echo ""
            echo "Lines: ${PCT}% (${COVERED}/${TOTAL})"
            echo "Threshold: ${THRESHOLD}%"
            echo "$STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm build
      - run: pnpm audit:security
