name: Frontend CI

on:
  # No paths: filter here on purpose — this must always run on PRs to master
  # so it can be a required status check without ever getting stuck "pending"
  # on a PR that never touches apps/frontend/**.
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@ce3b1e5f04cd26dbb4614172464b544b5633cc92 # v2.1.0
        env:
          # This step runs a real `pnpm install` internally. apps/frontend/.pnpmfile.mjs blocks
          # any pnpm add/update/install/remove that isn't marked this way — CI trusts the
          # already-committed, already-reviewed lockfile rather than re-running check:supply-chain
          # here (see docs/features/supply-chain-check.md and ADR-008). Scoped to this step only —
          # no later step in this job needs it, and scoping narrowly means a step added later that
          # does invoke pnpm add/update/install/remove doesn't silently inherit the bypass.
          PROUST_SAFE_PNPM: "1"
        with:
          version: "11.19.0"
          runtime: node@24
          working-directory: apps/frontend
          require-lockfile: true
          cache: true
      - run: pnpm lint
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          # Keep in sync with vite.config.ts's test.coverage.thresholds.lines.
          THRESHOLD=85
          read -r COVERED TOTAL <<< "$(node scripts/print-coverage-summary.ts 2>/dev/null)"
          bash "${{ github.workspace }}/.github/scripts/coverage-summary.sh" \
            "Frontend code coverage" "$THRESHOLD" "$COVERED" "$TOTAL" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm build

  # Not a required status check (see branch protection settings) — a High/Critical advisory on
  # the existing dependency tree isn't caused by this PR's diff, so it must never be able to
  # block an unrelated change. Still runs on every PR/push for visibility (not just the weekly
  # scan), and is still allowed to actually fail/show red — being non-required is what keeps it
  # from blocking, not a continue-on-error that would hide a real finding as green.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@ce3b1e5f04cd26dbb4614172464b544b5633cc92 # v2.1.0
        with:
          version: "11.19.0"
          runtime: node@24
          working-directory: apps/frontend
          require-lockfile: true
          install: false
      # Calls the raw command, not the `audit:security` package.json script: `pnpm run <script>`
      # materializes node_modules first if it's missing, even with install: false above — the
      # same trap already documented for the weekly workflow (frontend-security-audit.yml). Keep
      # this threshold in sync with that script and with the weekly workflow if it ever changes.
      - run: pnpm audit --audit-level high
