name: Backend CI

on:
  # No paths: filter here on purpose — this must always run on PRs to master
  # so it can be a required status check without ever getting stuck "pending"
  # on a PR that never touches apps/backend/**.
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew build --no-daemon
      - name: Coverage summary
        if: always()
        run: |
          REPORT=build/reports/jacoco/test/jacocoTestReport.xml
          if [ ! -f "$REPORT" ]; then
            {
              echo "## Backend code coverage"
              echo ""
              echo "Coverage unavailable — report not generated"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          LINE=$(grep -o '<counter type="LINE"[^/]*/>' "$REPORT" | tail -1)
          MISSED=$(echo "$LINE" | grep -o 'missed="[0-9]*"' | grep -o '[0-9]*')
          COVERED=$(echo "$LINE" | grep -o 'covered="[0-9]*"' | grep -o '[0-9]*')
          TOTAL=$((MISSED + COVERED))
          THRESHOLD=90
          PCT=$(awk "BEGIN { printf \"%.2f\", ($COVERED / $TOTAL) * 100 }")
          STATUS="✅ Above threshold"
          awk "BEGIN { exit !($PCT < $THRESHOLD) }" && STATUS="❌ Below threshold"
          {
            echo "## Backend code coverage"
            echo ""
            echo "Lines: ${PCT}% (${COVERED}/${TOTAL})"
            echo "Threshold: ${THRESHOLD}%"
            echo "$STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
