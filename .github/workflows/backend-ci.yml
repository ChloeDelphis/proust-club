name: Backend CI

on:
  # No paths: filter here on purpose — this must always run on PRs to master
  # so it can be a required status check without ever getting stuck "pending"
  # on a PR that never touches apps/backend/**.
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew build --no-daemon
      - name: Coverage summary
        if: always()
        run: |
          REPORT=build/reports/jacoco/test/jacocoTestReport.xml
          # Keep in sync with the `minimum` in build.gradle.kts's jacocoTestCoverageVerification.
          THRESHOLD=90
          {
            echo "## Backend code coverage"
            echo ""
            if [ -f "$REPORT" ]; then
              LINE=$(grep -o '<counter type="LINE"[^/]*/>' "$REPORT" | tail -1)
              read -r MISSED COVERED <<< "$(echo "$LINE" | grep -oE '[0-9]+' | tr '\n' ' ')"
            fi
            if [[ "$MISSED" =~ ^[0-9]+$ && "$COVERED" =~ ^[0-9]+$ ]] && [ "$((MISSED + COVERED))" -gt 0 ]; then
              TOTAL=$((MISSED + COVERED))
              PCT=$(awk "BEGIN { printf \"%.2f\", ($COVERED / $TOTAL) * 100 }")
              STATUS="✅ Above threshold"
              awk "BEGIN { exit !($PCT < $THRESHOLD) }" && STATUS="❌ Below threshold"
              echo "Lines: ${PCT}% (${COVERED}/${TOTAL})"
              echo "Threshold: ${THRESHOLD}%"
              echo "$STATUS"
            else
              echo "Coverage unavailable — report not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
